apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-gitops
  namespace: argocd
spec:
  project: default
  sources:
    # Fuente 1: Helm Chart oficial de Traefik
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 33.0.0
      helm:
        valueFiles:
          - $values/traefik/values.yaml

    # Fuente 2: Tu repositorio en GitLab
    - repoURL: https://gitlab.lst.tfo.upm.es/kubernetescore/aplicacionescore.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true