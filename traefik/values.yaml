deployment:
  kind: DaemonSet

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  type: ClusterIP

api:
  dashboard: true

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

ingressRoute:
  dashboard:
    enabled: false

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-redirect
      namespace: traefik-system
    spec:
      redirectRegex:
        regex: "^https?://xxx/($\vert{}dashboard$)"
        replacement: "https://xxx/dashboard/"
        permanent: true

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-oauth
      namespace: traefik-system
    spec:
      forwardAuth:
        address: "http://oauth2-proxy.traefik-system.svc.cluster.local:4180/"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email

  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: traefik-dashboard-cert
      namespace: traefik-system
    spec:
      secretName: traefik-dashboard-tls
      dnsNames:
        - xxx
      issuerRef:
        name: step-ca-issuer
        kind: ClusterIssuer

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: oauth2-proxy
      namespace: traefik-system
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: oauth2-proxy
      template:
        metadata:
          labels:
            app: oauth2-proxy
        spec:
          containers:
          - name: oauth2-proxy
            image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
            args:
              - --provider=keycloak-oidc
              - --oidc-issuer-url=https://xxx/realms/Nutty
              - --client-id=xxx
              - --client-secret=xxx
              - --cookie-secret=xxx
              - --email-domain=*
              - --http-address=0.0.0.0:4180
              - --redirect-url=https://xxx/oauth2/callback
              - --cookie-secure=true
              - --ssl-insecure-skip-verify=true
              - --insecure-oidc-allow-unverified-email=true
              - --user-id-claim=preferred_username
              - --oidc-email-claim=preferred_username
              - --upstream=static://200
              - --skip-provider-button=true
            ports:
            - containerPort: 4180
              name: http

  - apiVersion: v1
    kind: Service
    metadata:
      name: oauth2-proxy
      namespace: traefik-system
    spec:
      ports:
      - port: 4180
        targetPort: 4180
        name: http
      selector:
        app: oauth2-proxy

  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: oauth2-proxy-ingress
      namespace: traefik-system
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - xxx
          secretName: traefik-dashboard-tls
      rules:
        - host: xxx
          http:
            paths:
              - path: /oauth2
                pathType: Prefix
                backend:
                  service:
                    name: oauth2-proxy
                    port:
                      number: 4180

  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-dashboard-ingressroute
      namespace: traefik-system
    spec:
      entryPoints:
        - web
        - websecure
      routes:
        - match: Host(`xxx`) && (Path(`/`) || PathPrefix(`/dashboard`) || PathPrefix(`/api`))
          kind: Rule
          services:
            - name: api@internal
              kind: TraefikService
          middlewares:
            - name: traefik-dashboard-redirect
            - name: traefik-oauth
      tls:
        secretName: traefik-dashboard-tls