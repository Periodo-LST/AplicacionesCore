deployment:
  kind: DaemonSet

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  type: ClusterIP

api:
  dashboard: true

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

ingressRoute:
  dashboard:
    enabled: false

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-redirect
      namespace: traefik-system
    spec:
      redirectRegex:
        regex: "^https?://traefik\\.fluffy\\.lst/($|dashboard$)"
        replacement: "https://traefik.fluffy.lst/dashboard/"
        permanent: true

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: authentik-auth
      namespace: traefik-system
    spec:
      forwardAuth:
        address: http://authentik-gitops-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - Authorization

  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: traefik-dashboard-cert
      namespace: traefik-system
    spec:
      secretName: traefik-dashboard-tls
      dnsNames:
        - traefik.fluffy.lst
      issuerRef:
        name: step-ca-issuer
        kind: ClusterIssuer

  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: traefik-dashboard-ingressroute
      namespace: traefik-system
    spec:
      entryPoints:
        - web
        - websecure
      routes:
        - match: Host(`traefik.fluffy.lst`) && (Path(`/`) || PathPrefix(`/dashboard`) || PathPrefix(`/api`) || PathPrefix(`/outpost.goauthentik.io`))
          kind: Rule
          services:
            - name: api@internal
              kind: TraefikService
          middlewares:
            - name: traefik-dashboard-redirect
            - name: authentik-auth
      tls:
        secretName: traefik-dashboard-tls