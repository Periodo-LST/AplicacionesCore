apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    caBundle: xxx
    privateKeySecretRef:
      name: step-ca-account-key-v2
    server: https://xxx/acme/acme-internal/directory
    solvers:
      - http01:
          ingress:
            class: traefik