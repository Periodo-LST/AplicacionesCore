apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-oauth
  namespace: longhorn-system
spec:
  forwardAuth:
    address: "http://oauth2-proxy.longhorn-system.svc.cluster.local:4180/"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: longhorn-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        args:
          - --provider=keycloak-oidc
          - --oidc-issuer-url=https://xxx/realms/Nutty
          - --client-id=xxx
          - --client-secret=xxx
          - --cookie-secret=xxx
          - --email-domain=*
          - --http-address=0.0.0.0:4180
          - --redirect-url=https://xxx/oauth2/callback
          - --cookie-secure=true
          - --ssl-insecure-skip-verify=true
          - --insecure-oidc-allow-unverified-email=true
          - --user-id-claim=preferred_username
          - --oidc-email-claim=preferred_username
          - --upstream=static://200
          - --skip-provider-button=true
        ports:
        - containerPort: 4180
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: longhorn-system
spec:
  ports:
  - port: 4180
    targetPort: 4180
    name: http
  selector:
    app: oauth2-proxy
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-ingress
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: step-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xxx
      secretName: longhorn-tls-v2
  rules:
    - host: xxx
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180