global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  enabled: true
  replicas: 1
  volumes:
    - name: custom-ca
      secret:
        secretName: keycloak-ca-cert
    - name: ca-certs
      emptyDir: {}
  volumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs
  extraInitContainers:
    - name: update-ca-certs
      image: alpine:3.20
      command:
        - sh
        - -c
        - |
          apk add --no-cache ca-certificates >/dev/null
          cp /custom-ca/root.crt /usr/local/share/ca-certificates/keycloak-root-ca.crt
          cp /custom-ca/intermediate.crt /usr/local/share/ca-certificates/keycloak-intermediate-ca.crt
          update-ca-certificates
          cp -r /etc/ssl/certs/. /tmp/ca-certs/
      volumeMounts:
        - name: custom-ca
          mountPath: /custom-ca
        - name: ca-certs
          mountPath: /tmp/ca-certs

  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: "longhorn"
    accessMode: ReadWriteOnce

  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "step-ca-issuer"
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "vault-vault-oauth@kubernetescrd"
    hosts:
      - host: vault.fluffy.lst
        paths:
          - /
    tls:
      - secretName: vault-tls
        hosts:
          - vault.fluffy.lst

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "raft" {
        path = "/vault/data"
      }