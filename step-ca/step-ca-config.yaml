apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-gitops-step-certificates-config
  namespace: step-ca
data:
  ca.json: |
    {
      "root": "/home/step/certs/root_ca.crt",
      "federatedRoots": null,
      "crt": "/home/step/certs/intermediate_ca.crt",
      "key": "/home/step/secrets/intermediate_ca_key",
      "address": ":9000",
      "insecureAddress": "",
      "dnsNames": [
        "xxx"
      ],
      "logger": {
        "format": "text"
      },
      "db": {
        "type": "badgerv2",
        "dataSource": "/home/step/db",
        "badgerFileLoadingMode": ""
      },
      "authority": {
        "provisioners": [
          {
            "type": "JWK",
            "name": "xxx",
            "key": {
              "use": "sig",
              "kty": "EC",
              "kid": "xxx",
              "crv": "P-256",
              "alg": "ES256",
              "x": "xxx",
              "y": "xxx"
            },
            "encryptedKey": "xxx"
          },
          {
            "type": "ACME",
            "name": "acme-internal",
            "options": {
              "challenges": [
                "http-01"
              ]
            }
          }
        ]
      },
      "tls": {
        "cipherSuites": [
          "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
          "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        ],
        "minVersion": 1.2,
        "maxVersion": 1.3,
        "renegotiation": false
      }
    }
  defaults.json: |
    {
      "ca-url": "https://step-ca-step-certificates.step-ca.svc.cluster.local",
      "ca-config": "/home/step/config/ca.json",
      "fingerprint": "xxx",
      "root": "/home/step/certs/root_ca.crt"
    }