apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: step-ca-tls-passthrough
  namespace: step-ca
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`xxx`)
      services:
        - name: step-ca-gitops-step-certificates
          port: 443
  tls:
    passthrough: true