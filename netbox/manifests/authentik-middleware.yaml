apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: netbox-authentik-auth
  namespace: netbox
spec:
  forwardAuth:
    address: http://authentik-gitops-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-Authentik-Username
      - X-Authentik-Groups
      - X-Authentik-Email
      - X-Authentik-Name
      - X-Authentik-Uid
      - X-Forwarded-User