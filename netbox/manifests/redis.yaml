apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-redis
  namespace: netbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbox-redis
  template:
    metadata:
      labels:
        app: netbox-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          command: ["redis-server", "--requirepass", "xxx"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-redis-svc
  namespace: netbox
spec:
  ports:
    - port: 6379
  selector:
    app: netbox-redis